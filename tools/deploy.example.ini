; Скопируйте в tools/deploy.ini и заполните. deploy.ini в git не попадает.
; Логин и пароль FTP — в панели хостинга или в письме от hoster.by.
[ftp]
host = negtab.xyz
port = 21
user = ваш_ftp_логин
password = ваш_ftp_пароль
; Папка сайта относительно входа по FTP: там, где лежит index.html
remote_dir = .
; Адрес этой папки в интернете: большие файлы собираются на сервере через него
site_url = https://negtab.xyz
; У FTP-сервера самоподписанный сертификат: здесь его SHA-256 отпечаток, без совпадения пароль не отправится
tls_fingerprint =
